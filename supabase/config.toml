# Supabase local config (Edge Functions + optional cron)
# See: https://supabase.com/docs/guides/functions

[functions.send-daily-reminders]
verify_jwt = false

[functions.send-test-email]
verify_jwt = true

[functions.send-test-push]
verify_jwt = true

[functions.trigger-my-reminders]
verify_jwt = true

# Configure in Supabase Dashboard → Edge Functions → Schedules after deploy:
#   Function: send-daily-reminders
#   cron: * * * * *   (every minute — send within ~1 min of topic reminder time)
#   Authorization: Bearer <CRON_SECRET>
