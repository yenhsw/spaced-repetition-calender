<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Spaced Repetition Calendar</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Spaced repetition study calendar with review reminders">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spaced Rep">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.css">
  <script>
    (function () {
      var recoveryKey = 'sw-recovery-reload';
      var chunkError = /Loading chunk|Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module/i;

      function recoverFromStaleCache() {
        if (sessionStorage.getItem(recoveryKey)) return;
        sessionStorage.setItem(recoveryKey, '1');
        if (!('serviceWorker' in navigator)) {
          location.reload();
          return;
        }
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(function () {
          if (!('caches' in window)) return;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        }).finally(function () {
          location.reload();
        });
      }

      window.addEventListener('error', function (event) {
        var msg = String(event.message || (event.error && event.error.message) || '');
        if (chunkError.test(msg)) recoverFromStaleCache();
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = String(reason && reason.message ? reason.message : reason || '');
        if (chunkError.test(msg)) recoverFromStaleCache();
      });

      window.addEventListener('load', function () {
        sessionStorage.removeItem(recoveryKey);
      });
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
